<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}电商风险控制系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <!-- Chart.js 看板页按需加载 -->
    {% block extra_head %}{% endblock %}
    <style>
        .sidebar { min-height: calc(100vh - 56px); background: #1e293b; }
        .sidebar .nav-link { color: #94a3b8; padding: 10px 16px; border-radius: 6px; margin: 2px 8px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: #334155; }
        .sidebar .nav-link i { margin-right: 8px; }
        .main-content { background: #f1f5f9; min-height: calc(100vh - 56px); }
        .badge-risk-low { background: #22c55e; }
        .badge-risk-medium { background: #f59e0b; }
        .badge-risk-high { background: #ef4444; }
    </style>
</head>
<body>
    <!-- 顶栏 -->
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1"><i class="bi bi-shield-check"></i> 电商风险控制平台</span>
        <div class="d-flex align-items-center gap-3">
            <select id="roleSwitcher" class="form-select form-select-sm bg-dark text-light border-secondary" style="width:auto;">
                <option value="admin">风控管理员</option>
                <option value="reviewer">风控审核员</option>
                <option value="viewer">数据查看人</option>
            </select>
            <span class="text-light small">当前: <strong id="roleLabel">风控管理员</strong></span>
        </div>
    </nav>

    <div class="d-flex">
        <!-- 侧边栏 -->
        <div class="sidebar d-flex flex-column" style="width:200px;">
            <nav class="nav flex-column mt-3">
                <a class="nav-link {% if current_page == 'check' %}active{% endif %}" href="/check">
                    <i class="bi bi-search"></i> 风险检查
                </a>
                <a class="nav-link {% if current_page == 'rules' %}active{% endif %}" href="/rules">
                    <i class="bi bi-sliders"></i> 规则管理
                </a>
                <a class="nav-link {% if current_page == 'cases' %}active{% endif %}" href="/cases">
                    <i class="bi bi-folder2-open"></i> 案件管理
                </a>
                <a class="nav-link {% if current_page == 'blacklist' %}active{% endif %}" href="/blacklist">
                    <i class="bi bi-shield-x"></i> 黑名单
                </a>
                <a class="nav-link {% if current_page == 'profile' %}active{% endif %}" href="/profile">
                    <i class="bi bi-person-badge"></i> 用户画像
                </a>
                <a class="nav-link {% if current_page == 'dashboard' %}active{% endif %}" href="/dashboard">
                    <i class="bi bi-bar-chart"></i> 运营看板
                </a>
            </nav>
        </div>

        <!-- 主内容区 -->
        <div class="main-content flex-grow-1 p-4">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 角色切换
        document.getElementById('roleSwitcher').addEventListener('change', function() {
            document.getElementById('roleLabel').textContent = this.options[this.selectedIndex].text;
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
